<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- soft glow blobs -->
  <circle cx="200" cy="150" r="320" fill="url(#glowCyan)"/>
  <circle cx="1400" cy="750" r="380" fill="url(#glowAmber)"/>
  <circle cx="1300" cy="120" r="220" fill="url(#glowCyan)" opacity="0.5"/>

  <!-- circuit-like connecting lines -->
  <g stroke="#2dd4bf" stroke-width="1.5" fill="none" opacity="0.35">
    <path d="M0 300 H180 V220 H420"/>
    <path d="M1600 200 H1300 V340 H1020"/>
    <path d="M0 700 H260 V620 H600"/>
    <path d="M1600 650 H1250 V780 H900"/>
    <path d="M700 0 V120 H900 V0"/>
  </g>
  <g fill="#2dd4bf" opacity="0.6">
    <circle cx="420" cy="220" r="4"/>
    <circle cx="1020" cy="340" r="4"/>
    <circle cx="600" cy="620" r="4"/>
    <circle cx="900" cy="780" r="4"/>
    <circle cx="700" cy="120" r="4"/>
    <circle cx="900" cy="120" r="4"/>
  </g>

  <!-- code brackets, large and faint -->
  <text x="60" y="500" font-family="Consolas, 'Courier New', monospace" font-size="260" fill="#38bdf8" opacity="0.10">&lt;/&gt;</text>
  <text x="1000" y="860" font-family="Consolas, 'Courier New', monospace" font-size="200" fill="#fbbf24" opacity="0.08">{ }</text>
  <text x="1180" y="260" font-family="Consolas, 'Courier New', monospace" font-size="140" fill="#a78bfa" opacity="0.10">01</text>

  <!-- floating code snippet lines (decorative, non-legible-scale) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#64748b" opacity="0.45">
    <text x="80" y="90">const build = () =&gt; {</text>
    <text x="110" y="112">return project.render();</text>
    <text x="80" y="134">}</text>

    <text x="1160" y="470">function init(app) {</text>
    <text x="1190" y="492">app.mount('#root');</text>
    <text x="1160" y="514">}</text>

    <text x="130" y="800">import React from 'react';</text>
    <text x="130" y="822">export default App;</text>
  </g>

  <!-- faint binary strip -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#334155" opacity="0.5">
    <text x="20" y="20">01001 11010 00110 10101 11001 00101 10110</text>
    <text x="20" y="880">10110 00101 11001 10101 00110 11010 01001</text>
  </g>

  <!-- vignette to keep foreground text readable -->
  <rect width="1600" height="900" fill="#0a0f1a" opacity="0.25"/>
</svg>
